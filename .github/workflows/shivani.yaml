name: myworkflow1
on:
  push:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
          whoami
          pwd
          cd 
          cat /etc/os-release
          ls -al
          cat /etc/passwd
      - name: mystep2-clone the repo in current directory
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al
      - name: mystep4-check the docker image
        run: docker image build -t shivanipanwar/shivaniimage_nov1:t${{ github.run_number }} -f Dockerfile .
      - name: mystep5-check the docker image 
        run: docker images
      - name: mystep6-login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrects.DOCKERHUB_USERNAME }}
          password: ${{ secrets. DOCKERHUB_TOKEN }}
     - name: mystep7-push the docker image 
       run: docker image push shivanipanwar/shivaniimage_nov1:t${{ github.run_number }}     

